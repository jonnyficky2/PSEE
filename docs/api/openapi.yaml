openapi: 3.0.3
info:
  title: PSEE Orchestration API
  version: 1.0.0
  description: CONTRACT BASELINE — FRONTEND CONSUMPTION APPROVED
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: orchestration
paths:
  /tasks:
    post:
      tags: [orchestration]
      summary: Submit an orchestration task
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
            example:
              taskId: task-001
              title: Add login page
              role: coder
              instructions: Implement the login page
              dataSensitivity: INTERNAL
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PolicyRejected' }
    get:
      tags: [orchestration]
      summary: Retrieve task and latest execution status
      parameters:
        - in: query
          name: taskId
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Task status, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{taskId}/cancel:
    post:
      tags: [orchestration]
      summary: Request cancellation of a running task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202': { description: Cancellation requested, content: { application/json: { schema: { $ref: '#/components/schemas/TaskResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    CorrelationId:
      in: header
      name: X-Correlation-ID
      required: false
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
  schemas:
    CreateTaskRequest:
      type: object
      required: [taskId, title, role, instructions]
      additionalProperties: false
      properties:
        taskId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        role: { type: string, enum: [planner, architect, researcher, coder, tester, reviewer, docs] }
        instructions: { type: string, minLength: 1 }
        dataSensitivity: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, SECRET], default: INTERNAL }
    TaskResponse:
      type: object
      required: [taskId, status, correlationId]
      properties:
        taskId: { type: string }
        executionId: { type: string }
        correlationId: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, CHECKPOINTED, DONE, FAILED, TIMEOUT, INTERRUPTED, CANCELLED, RECOVERING, NEEDS_USER, APPROVAL_REQUIRED, REJECTED] }
        error: { $ref: '#/components/schemas/Error' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        correlationId: { type: string }
    ApprovalRequired:
      type: object
      required: [status, reason, correlationId]
      properties:
        status: { type: string, enum: [APPROVAL_REQUIRED] }
        reason: { type: string }
        correlationId: { type: string }
    ErrorResponse:
      type: object
      required: [error, correlationId]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        correlationId: { type: string }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Invalid state or duplicate conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PolicyRejected: { description: Policy rejected the task, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
